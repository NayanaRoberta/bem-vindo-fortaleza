<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Bem-vindo a Fortaleza</title>
    <link rel="stylesheet" href="css/style-cadastro.css">
</head>
<body>
    <main class="cadastro-container">
        <div class="cadastro-box">
            <div class="logo-cadastro">
                <img src="img/logo inicial.png" alt="Logo Bem-vindo a Fortaleza" class="img-logo-cadastro">
                <h2>Criar Conta</h2>
            </div>
            
            <form action="#" method="POST" class="cadastro-form">
                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">
                </div>
                
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required placeholder="Crie uma senha">
                </div>

                <div class="input-group">
                    <label for="confirma-senha">Confirmar Senha</label>
                    <input type="password" id="confirma-senha" name="confirma-senha" required placeholder="Repita a senha">
                </div>
                
                <button type="submit" class="btn-cadastrar">Cadastrar</button>
            </form>
            
            <div class="cadastro-footer">
                <p>Já tem uma conta? <a href="login.html" class="link-login">Faça login aqui</a></p>
                <a href="index.html" class="link-voltar">← Voltar para a página inicial</a>
            </div>
        </div>
    </main>
</body>
</html>
